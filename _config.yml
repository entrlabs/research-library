title: EntrLabs Research Library
description: Curated research foundations, findings, critiques, and open questions for EntrLabs frameworks, learning models, and practices.
url: "https://library.entr.cc"
baseurl: ""
markdown: kramdown
permalink: pretty
collections:
  papers:
    output: true
    permalink: /entrsl/papers/:name/
defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
exclude:
  - Gemfile
  - Gemfile.lock
  - scripts
  - audit
  - README.md
  - references.bib
