title: EntrLabs Research Library
description: Curated research for frameworks, learning models, and practices developed by EntrLabs.
url: ""
baseurl: ""
markdown: kramdown
permalink: pretty
collections:
  papers:
    output: true
    permalink: /evidence/entrsl/papers/:name/
defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
exclude:
  - Gemfile
  - Gemfile.lock
  - scripts
  - audit
  - README.md
  - references.bib
